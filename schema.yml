        name: is_active
        schema:
          type: boolean
        description: Active status
      - in: query
        name: max_price
        schema:
          type: number
          format: double
        description: Maximum price
      - in: query
        name: min_price
        schema:
          type: number
          format: double
        description: Minimum price
      - in: query
        name: search
        schema:
          type: string
        description: Keyword search (name/description)
      - in: query
        name: subcategory
        schema:
          type: string
