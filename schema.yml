                  $ref: '#/components/schemas/ServiceRead'
          description: ''
components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_uuid:
          type: string
          format: uuid
          readOnly: true
        address_line:
          type: string
          maxLength: 255
        locality:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        pincode:
          type: string
          pattern: ^\d{6}$
          maxLength: 6
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        address_type:
          $ref: '#/components/schemas/AddressTypeEnum'
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line
      - city
      - created_at
      - id
      - locality
      - pincode
      - state
      - updated_at
      - user_uuid
    AddressTypeEnum:
      enum:
      - HOME
      - WORK
      - OTHER
      type: string
      description: |-
        * `HOME` - Home
        * `WORK` - Work
        * `OTHER` - Other
    BookingAddress:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        address_type:
          $ref: '#/components/schemas/AddressTypeEnum'
        address_line:
          type: string
          maxLength: 255
        locality:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        pincode:
          type: string
          pattern: ^\d{6}$
          maxLength: 6
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
      required:
      - address_line
      - city
      - locality
      - pincode
      - state
      - uuid
    BookingBusiness:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 20
      required:
      - name
      - uuid
    BookingCreate:
      type: object
      properties:
        service_uuid:
          type: string
          format: uuid
        address_uuid:
          type: string
          format: uuid
        scheduled_date:
          type: string
          format: date
        scheduled_time:
          type: string
          format: time
        notes:
          type: string
          default: ''
      required:
      - address_uuid
      - scheduled_date
      - scheduled_time
      - service_uuid
    BookingRead:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/BookingUser'
          readOnly: true
        business:
          allOf:
          - $ref: '#/components/schemas/BookingBusiness'
          readOnly: true
        service:
          allOf:
          - $ref: '#/components/schemas/BookingService'
          readOnly: true
        address:
          allOf:
          - $ref: '#/components/schemas/BookingAddress'
          readOnly: true
        scheduled_date:
          type: string
          format: date
        scheduled_time:
          type: string
          format: time
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Snapshot of the service price at the time of booking.
        status:
          $ref: '#/components/schemas/BookingReadStatusEnum'
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - business
      - created_at
      - price
      - scheduled_date
      - scheduled_time
      - service
      - updated_at
      - user
      - uuid
    BookingReadStatusEnum:
      enum:
      - PENDING
      - CONFIRMED
      - REJECTED
      - CANCELLED
      - IN_PROGRESS
      - COMPLETED
      type: string
      description: |-
        * `PENDING` - Pending
        * `CONFIRMED` - Confirmed
        * `REJECTED` - Rejected
        * `CANCELLED` - Cancelled
        * `IN_PROGRESS` - In Progress
        * `COMPLETED` - Completed
    BookingService:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
