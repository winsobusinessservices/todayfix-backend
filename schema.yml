      - Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
          multipart/form-data:
