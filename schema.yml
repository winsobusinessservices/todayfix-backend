        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceRead'
          description: ''
  /api/services/{uuid}/:
    get:
      operationId: services_retrieve
      description: Retrieve a single service by UUID.
      summary: Service Detail
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Services
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRead'
          description: ''
  /api/services/{uuid}/delete/:
    delete:
      operationId: services_delete_destroy
      description: Deactivate a service. Only the business owner can deactivate their
        services.
      summary: Delete Service
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Services
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/services/{uuid}/update/:
    patch:
      operationId: services_update_partial_update
      description: Update an existing service. Only the business owner can update
        their services.
      summary: Update Service
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedServiceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedServiceUpdate'
