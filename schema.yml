openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /api/auth/addresses/:
    get:
      operationId: auth_addresses_retrieve
      description: Retrieve all addresses of the authenticated user.
      summary: List User Addresses
      tags:
      - Address
      security:
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/addresses/{address_id}/:
    get:
      operationId: auth_addresses_retrieve_2
      description: Retrieve a specific address of the authenticated user.
      summary: Get User Address
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - Address
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/auth/addresses/{address_id}/delete/:
    delete:
      operationId: auth_addresses_delete_destroy
      description: Delete an existing address of the authenticated user.
      summary: Delete User Address
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - Address
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/addresses/{address_id}/update/:
    post:
      operationId: auth_addresses_update_create
      description: Update an existing address of the authenticated user.
      summary: Update User Address
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        required: true
      tags:
      - Address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Address'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/addresses/create/:
    post:
      operationId: auth_addresses_create_create
      description: Add a new address for the authenticated user.
      summary: Add User Address
      tags:
      - Address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Address'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Login using email and password.
      summary: Login
      tags:
      - Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/auth/login/send-otp/:
    post:
      operationId: auth_login_send_otp_create
      summary: Send Login OTP
      tags:
      - Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginSendOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginSendOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginSendOTP'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/verify-otp/:
    post:
      operationId: auth_login_verify_otp_create
      summary: Verify Login OTP
      tags:
      - Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Logout the user by blacklisting the refresh token.
      summary: Logout
      tags:
      - Logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/auth/password/forgot/:
    post:
      operationId: auth_password_forgot_create
      summary: Send password reset link
      tags:
      - Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      tags:
      - Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedPasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UnifiedPasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UnifiedPasswordReset'
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Retrieve the profile details of the authenticated user.
      summary: Profile
      tags:
      - Accounts
      security:
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/profile/update/:
    post:
      operationId: auth_profile_update_create
      description: Update the authenticated user's profile.
      summary: Update Profile
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProfile'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/signup/register/:
    post:
      operationId: auth_signup_register_create
      description: Creates a pending user registration and sends an email verification
        link.
      summary: Register User
      tags:
      - SignUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterUser'
        required: true
      responses:
        '201':
          description: Verification email sent successfully.
  /api/auth/signup/verify-email/:
    post:
      operationId: auth_signup_verify_email_create
      description: Verifies the user's email using the UUID and verification token
        received by email.
      summary: Verify Email
      tags:
      - SignUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/signup/verify-otp/:
    post:
      operationId: auth_signup_verify_otp_create
      description: Verify the OTP sent to a new user's phone number.
      summary: Verify Signup OTP
      tags:
      - SignUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupVerifyOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupVerifyOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupVerifyOTP'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/bookings/:
    get:
      operationId: bookings_list
      description: List all bookings for the authenticated user.
      summary: List My Bookings
      tags:
      - Bookings
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingRead'
          description: ''
  /api/bookings/{uuid}/:
    get:
      operationId: bookings_retrieve
      description: Get details of a specific user booking.
      summary: My Booking Detail
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Bookings
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRead'
          description: ''
  /api/bookings/{uuid}/cancel/:
    post:
      operationId: bookings_cancel_create
      description: Cancel a pending or confirmed booking.
      summary: Cancel Booking
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Bookings
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRead'
          description: ''
  /api/bookings/business/{uuid}/:
    get:
      operationId: bookings_business_retrieve
      description: Get details of a specific business booking.
      summary: Business Booking Detail
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Bookings
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRead'
          description: ''
  /api/bookings/business/{uuid}/accept/:
    post:
      operationId: bookings_business_accept_create
      description: Business accepts a pending booking.
      summary: Accept Booking
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Bookings
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRead'
          description: ''
  /api/bookings/business/{uuid}/complete/:
    post:
      operationId: bookings_business_complete_create
      description: Business marks an in-progress booking as completed.
      summary: Complete Booking
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Bookings
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRead'
          description: ''
  /api/bookings/business/{uuid}/reject/:
    post:
      operationId: bookings_business_reject_create
      description: Business rejects a pending booking.
      summary: Reject Booking
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Bookings
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRead'
          description: ''
  /api/bookings/business/{uuid}/start/:
    post:
      operationId: bookings_business_start_create
      description: Business marks a confirmed booking as in-progress.
      summary: Start Booking
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Bookings
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRead'
          description: ''
  /api/bookings/business/list/:
    get:
      operationId: bookings_business_list_list
      description: List all bookings for the authenticated user's business.
      summary: List Business Bookings
      tags:
      - Bookings
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingRead'
          description: ''
  /api/bookings/create/:
    post:
      operationId: bookings_create_create
      description: Create a new booking as a user.
      summary: Create Booking
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRead'
          description: ''
  /api/business/admin/applications/:
    get:
      operationId: business_admin_applications_list
      summary: List business applications
      tags:
      - Business Administration
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessApplicationFull'
          description: ''
  /api/business/admin/applications/{uuid}/approve/:
    post:
      operationId: business_admin_applications_approve_create
      description: Approving the application changes the USER role to BUSINESS and
        creates the active BusinessProfile.
      summary: Approve business application
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Business Administration
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessApplicationFull'
          description: ''
  /api/business/admin/applications/{uuid}/reject/:
    post:
      operationId: business_admin_applications_reject_create
      description: Admin must provide a rejection reason.
      summary: Reject business application
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Business Administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectBusinessApplication'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RejectBusinessApplication'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RejectBusinessApplication'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessApplicationFull'
          description: ''
  /api/business/applications/:
    post:
      operationId: business_applications_create
      description: |-
        Only USER accounts can use this API. All business application information must be submitted in ONE multipart/form-data request.

        INDIVIDUAL:
        - PAN OR Aadhaar minimum one complete pair
        - Bank details mandatory

        COMPANY / INVESTOR:
        - PAN number + document mandatory
        - Aadhaar number + document mandatory
        - At least one of GST/Udyam/Labour/BBMP/Food registration mandatory
        - Internal store photo mandatory
        - External store photo mandatory
        - Cancelled GST bill/book photo mandatory
        - Logo optional
        - Website optional
        - Bank details mandatory
      summary: Submit complete business application
      tags:
      - Business Application
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BusinessApplicationSubmit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BusinessApplicationSubmit'
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessApplicationSubmit'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessApplicationFull'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Only USER accounts allowed
  /api/business/applications/{uuid}/:
    get:
      operationId: business_applications_retrieve
      summary: View my business application
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Business Application
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessApplicationFull'
          description: ''
  /api/business/applications/list/:
    get:
      operationId: business_applications_list_list
      summary: List my business applications
      tags:
      - Business Application
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessApplicationFull'
          description: ''
  /api/business/profiles/:
    get:
      operationId: business_profiles_list
      summary: List my business profiles
      tags:
      - Business Profile
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessProfile'
          description: ''
  /api/business/profiles/{uuid}/:
    patch:
      operationId: business_profiles_partial_update
      summary: Update my business profile
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Business Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBusinessProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBusinessProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBusinessProfile'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      description: |-
        GET:
            List active categories.

        POST:
            ADMIN only - create category.
      summary: List categories
      tags:
      - Categories
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: categories_create
      description: |-
        GET:
            List active categories.

        POST:
            ADMIN only - create category.
      summary: Create category
      tags:
      - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{category_uuid}/subcategories/:
    get:
      operationId: categories_subcategories_list
      description: |-
        GET:
            List active subcategories under a category.

        POST:
            ADMIN only - create subcategory.
      summary: List subcategories
      parameters:
      - in: path
        name: category_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - SubCategories
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubCategory'
          description: ''
    post:
      operationId: categories_subcategories_create
      description: |-
        GET:
            List active subcategories under a category.

        POST:
            ADMIN only - create subcategory.
      summary: Create subcategory
      parameters:
      - in: path
        name: category_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - SubCategories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubCategory'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCategory'
          description: ''
  /api/categories/{uuid}/:
    get:
      operationId: categories_retrieve
      description: |-
        ADMIN can update category.
        Authenticated users can view it.
      summary: Get category details
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Categories
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      description: |-
        ADMIN can update category.
        Authenticated users can view it.
      summary: Update category
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/subcategories/{uuid}/:
    get:
      operationId: categories_subcategories_retrieve
      summary: Get subcategory
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - SubCategories
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCategory'
          description: ''
    patch:
      operationId: categories_subcategories_partial_update
      summary: Update subcategory
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - SubCategories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSubCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSubCategory'
          multipart/form-data:
            schema:
