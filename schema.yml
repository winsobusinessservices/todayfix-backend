          nullable: true
          description: |-
            Type of related entity (e.g. SIGNUP, BOOKING, PAYMENT)

            * `SIGNUP` - Signup
            * `BOOKING` - Booking
            * `PAYMENT` - Payment
            * `REFUND` - Refund
            * `PROMOTION` - Promotion
            * `ADMIN` - Admin
          oneOf:
          - $ref: '#/components/schemas/ReferenceTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        reference_id:
          type: string
          nullable: true
          description: Identifier of related entity (UUID, booking ID, etc.)
          maxLength: 128
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
